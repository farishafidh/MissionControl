<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: #16213e;
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 1.4rem;
            color: #a78bfa;
            font-weight: 600;
        }

        .header .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main {
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        /* Sidebar — Agent List */
        .sidebar {
            background: #16213e;
            border-right: 1px solid #2a2a4a;
            padding: 16px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .agent-card {
            background: #1e293b;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .agent-card:hover {
            border-color: #a78bfa;
            background: #232946;
        }

        .agent-card.active {
            border-color: #a78bfa;
            background: #232946;
        }

        .agent-card .name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .agent-card .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .status-idle {
            background: #1e3a2e;
            color: #4ade80;
        }

        .status-working {
            background: #3a2e1e;
            color: #fbbf24;
        }

        .status-chatting {
            background: #2e1e3a;
            color: #c084fc;
        }

        /* Chat Area */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            overflow: hidden;
            min-height: 0;
        }

        .chat-tabs {
            display: flex;
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
        }

        .chat-tab {
            padding: 12px 20px;
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #9ca3af;
            transition: all 0.2s;
        }

        .chat-tab:hover {
            color: #e0e0e0;
        }

        .chat-tab.active {
            color: #a78bfa;
            border-bottom-color: #a78bfa;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 80%;
        }

        .message.from-user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #a78bfa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.from-user .avatar {
            background: #4ade80;
        }

        .message .sender-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 2px;
        }

        .message.from-user .sender-name {
            color: #4ade80;
            text-align: right;
        }

        .message .bubble {
            background: #1e293b;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .message.from-user .bubble {
            background: #2e1e4a;
            border-color: #4a2e6a;
        }

        .message .timestamp {
            font-size: 0.7rem;
            color: #6b7280;
            margin-top: 4px;
        }

        .chat-input {
            padding: 16px;
            border-top: 1px solid #2a2a4a;
            display: flex;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input input:focus {
            border-color: #a78bfa;
        }

        .chat-input button {
            background: #a78bfa;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .chat-input button:hover {
            background: #8b5cf6;
        }

        .upload-btn {
            background: #1e293b;
            border: 1px solid #2a2a4a;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            border-color: #a78bfa;
            background: #232946;
        }

        .message .bubble img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 6px;
            cursor: pointer;
        }

        .message .bubble img:hover {
            opacity: 0.9;
        }

        .message .bubble .file-attachment {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #16213e;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 6px;
            text-decoration: none;
            color: #a78bfa;
            font-size: 0.8rem;
            transition: border-color 0.2s;
        }

        .message .bubble .file-attachment:hover {
            border-color: #a78bfa;
        }

        .chat-area.drag-over {
            border: 2px dashed #a78bfa;
            background: #1a1a3e;
        }

        /* Right Panel — Kanban */
        .kanban-panel {
            background: #16213e;
            border-left: 1px solid #2a2a4a;
            padding: 16px;
            overflow-y: auto;
        }

        .kanban-panel h2 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .kanban-section {
            margin-bottom: 16px;
        }

        .kanban-section h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #2a2a4a;
        }

        .task-card {
            background: #1e293b;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .task-card .task-agent {
            font-size: 0.7rem;
            color: #a78bfa;
            margin-top: 4px;
        }

        .task-card .task-actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .task-card .task-actions button {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #2a2a4a;
            background: #16213e;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-card .task-actions button:hover {
            border-color: #a78bfa;
            color: #a78bfa;
        }

        .task-create {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .task-create input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 6px 10px;
            color: #e0e0e0;
            font-size: 0.8rem;
            outline: none;
        }

        .task-create input:focus {
            border-color: #a78bfa;
        }

        .task-create select {
            background: #1e293b;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 6px 8px;
            color: #e0e0e0;
            font-size: 0.75rem;
            outline: none;
        }

        .task-create button {
            background: #a78bfa;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .task-create button:hover {
            background: #8b5cf6;
        }

        /* Settings slider */
        .settings-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #2a2a4a;
        }

        .settings-section label {
            font-size: 0.8rem;
            color: #9ca3af;
            display: block;
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            accent-color: #a78bfa;
        }

        .slider-container span {
            font-size: 0.8rem;
            color: #a78bfa;
            min-width: 40px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3a3a5a;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mission Control AI</h1>
        <div class="status">
            <div class="dot"></div>
            <span id="connection-status">Connected</span>
        </div>
    </div>

    <div class="main">
        <!-- Left Sidebar: Agent List -->
        <div class="sidebar">
            <h2>Agents</h2>
            <div id="agent-list"></div>
        </div>

        <!-- Center: Chat -->
        <div class="chat-area">
            <div class="chat-tabs">
                <div class="chat-tab active" data-tab="group" onclick="switchTab('group')">Group Chat</div>
                <div class="chat-tab" data-tab="dm" onclick="switchTab('dm')">DM</div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="chat-input">
                <button class="upload-btn" onclick="document.getElementById('file-input').click()" title="Upload file">📎</button>
                <input type="file" id="file-input" style="display:none" accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.txt,.md,.csv,.docx,.xlsx,.json,.yaml,.yml" onchange="handleFileSelect(event)">
                <input type="text" id="msg-input" placeholder="Type a message... (paste images with Ctrl+V)" onkeydown="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- Right Panel: Kanban + Settings -->
        <div class="kanban-panel">
            <h2>Task Board</h2>
            <div class="task-create">
                <input type="text" id="new-task-title" placeholder="New task...">
                <select id="new-task-agent">
                </select>
                <button onclick="createTask()">+</button>
            </div>
            <div class="kanban-section">
                <h3>🔄 In Progress</h3>
                <div id="tasks-progress"></div>
            </div>
            <div class="kanban-section">
                <h3>💤 Idle</h3>
                <div id="tasks-idle"></div>
            </div>
            <div class="kanban-section">
                <h3>✅ Finished</h3>
                <div id="tasks-finished"></div>
            </div>

            <div class="settings-section">
                <label>Idle Chat Frequency</label>
                <div class="slider-container">
                    <input type="range" id="freq-slider" min="0" max="60" value="15" oninput="updateFrequency(this.value)">
                    <span id="freq-value">15m</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentTab = 'group';
        let selectedAgent = null;
        let agents = [];

        // Connect WebSocket
        function connectWS() {
            ws = new WebSocket(`ws://${window.location.host}/ws`);

            ws.onopen = () => {
                document.getElementById('connection-status').textContent = 'Connected';
                document.querySelector('.dot').style.background = '#4ade80';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWSMessage(data);
                playNotification();
            };

            ws.onclose = () => {
                document.getElementById('connection-status').textContent = 'Disconnected';
                document.querySelector('.dot').style.background = '#ef4444';
                // Reconnect after 3 seconds
                setTimeout(connectWS, 3000);
            };
        }

        // Notification sound using Web Audio API
        let audioCtx = null;
        function playNotification() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                // Silently fail if audio context not available
            }
        }

        function handleWSMessage(data) {
            if (data.type === 'group_chat') {
                if (currentTab === 'group') {
                    data.messages.forEach(msg => appendMessage(msg));
                }
            } else if (data.type === 'dm_response') {
                if (currentTab === 'dm' && data.agent_id === selectedAgent) {
                    appendMessage({
                        from_agent: data.agent_id,
                        from_name: getAgentName(data.agent_id),
                        content: data.response,
                        timestamp: new Date().toISOString()
                    });
                }
            }
        }

        function appendMessage(msg) {
            const container = document.getElementById('messages');
            const isUser = msg.from_agent === 'user';
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'from-user' : ''}`;

            const name = isUser ? 'You' : (msg.from_name || getAgentName(msg.from_agent) || msg.from_agent);
            const initials = name.substring(0, 2).toUpperCase();
            const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';

            div.innerHTML = `
                <div class="avatar">${initials}</div>
                <div>
                    <div class="sender-name">${name}</div>
                    <div class="bubble">${renderContent(msg.content)}</div>
                    <div class="timestamp">${time}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const message = input.value.trim();
            if (!message) return;

            if (currentTab === 'dm' && selectedAgent) {
                // Send DM via WebSocket
                ws.send(JSON.stringify({
                    type: 'dm',
                    agent_id: selectedAgent,
                    message: message
                }));

                // Show user message immediately
                appendMessage({
                    from_agent: 'user',
                    content: message,
                    timestamp: new Date().toISOString()
                });
            } else if (currentTab === 'group') {
                // Send to group chat via WebSocket
                ws.send(JSON.stringify({
                    type: 'group',
                    message: message
                }));

                // Show user message immediately
                appendMessage({
                    from_agent: 'user',
                    content: message,
                    timestamp: new Date().toISOString()
                });
            }

            input.value = '';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('messages').innerHTML = '';

            if (tab === 'group') {
                loadGroupMessages();
            } else if (tab === 'dm' && selectedAgent) {
                loadDMMessages(selectedAgent);
            }
        }

        function selectAgent(agentId) {
            selectedAgent = agentId;
            document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`[data-agent="${agentId}"]`).classList.add('active');

            if (currentTab === 'dm') {
                loadDMMessages(agentId);
            } else {
                switchTab('dm');
            }
        }

        function getAgentName(id) {
            const agent = agents.find(a => a.id === id);
            return agent ? agent.name : id;
        }

        // API calls
        async function loadAgents() {
            const res = await fetch('/api/agents/');
            const data = await res.json();
            agents = data.agents;
            renderAgents();
        }

        function renderAgents() {
            const container = document.getElementById('agent-list');
            container.innerHTML = agents.map(a => `
                <div class="agent-card ${a.id === selectedAgent ? 'active' : ''}" 
                     data-agent="${a.id}" onclick="selectAgent('${a.id}')">
                    <div class="name">${a.name}</div>
                    <span class="status-badge status-${a.status}">${a.status}</span>
                </div>
            `).join('');

            // Update task creation dropdown
            const select = document.getElementById('new-task-agent');
            select.innerHTML = agents.map(a => `
                <option value="${a.id}">${a.name}</option>
            `).join('');
        }

        async function loadGroupMessages() {
            const res = await fetch('/api/messages/group?limit=200');
            const data = await res.json();
            const container = document.getElementById('messages');
            container.innerHTML = '';
            data.messages.forEach(msg => appendMessage(msg));
        }

        async function loadDMMessages(agentId) {
            const res = await fetch(`/api/messages/dm/${agentId}?limit=200`);
            const data = await res.json();
            const container = document.getElementById('messages');
            container.innerHTML = '';
            data.messages.forEach(msg => appendMessage(msg));
        }

        async function loadTasks() {
            const res = await fetch('/api/tasks/');
            const data = await res.json();

            const progress = data.tasks.filter(t => t.status === 'in_progress');
            const idle = data.tasks.filter(t => t.status === 'idle');
            const finished = data.tasks.filter(t => t.status === 'finished');

            document.getElementById('tasks-progress').innerHTML = progress.map(t => `
                <div class="task-card">
                    ${t.title}
                    <div class="task-agent">${getAgentName(t.agent_id)}</div>
                    <div class="task-actions">
                        <button onclick="changeTaskStatus(${t.id}, 'idle')">→ Idle</button>
                        <button onclick="changeTaskStatus(${t.id}, 'finished')">→ Done</button>
                        <button onclick="deleteTask(${t.id})">✕</button>
                    </div>
                </div>
            `).join('') || '<div style="color:#6b7280;font-size:0.8rem;">No tasks</div>';

            document.getElementById('tasks-idle').innerHTML = idle.map(t => `
                <div class="task-card">
                    ${t.title}
                    <div class="task-agent">${getAgentName(t.agent_id)}</div>
                    <div class="task-actions">
                        <button onclick="changeTaskStatus(${t.id}, 'in_progress')">→ Working</button>
                        <button onclick="changeTaskStatus(${t.id}, 'finished')">→ Done</button>
                        <button onclick="deleteTask(${t.id})">✕</button>
                    </div>
                </div>
            `).join('') || '<div style="color:#6b7280;font-size:0.8rem;">No tasks</div>';

            document.getElementById('tasks-finished').innerHTML = finished.map(t => `
                <div class="task-card">
                    ${t.title}
                    <div class="task-agent">${getAgentName(t.agent_id)}</div>
                    <div class="task-actions">
                        <button onclick="changeTaskStatus(${t.id}, 'idle')">→ Reopen</button>
                        <button onclick="deleteTask(${t.id})">✕</button>
                    </div>
                </div>
            `).join('') || '<div style="color:#6b7280;font-size:0.8rem;">No tasks</div>';
        }

        async function createTask() {
            const title = document.getElementById('new-task-title').value.trim();
            const agentId = document.getElementById('new-task-agent').value;
            if (!title || !agentId) return;

            await fetch('/api/tasks/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({agent_id: agentId, title: title})
            });

            document.getElementById('new-task-title').value = '';
            await loadTasks();
        }

        async function changeTaskStatus(taskId, status) {
            await fetch(`/api/tasks/${taskId}`, {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({status: status})
            });
            await loadTasks();
        }

        async function deleteTask(taskId) {
            await fetch(`/api/tasks/${taskId}`, {method: 'DELETE'});
            await loadTasks();
        }

        async function updateFrequency(value) {
            document.getElementById('freq-value').textContent = value + 'm';
            await fetch('/api/settings/idle_chat_frequency', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({value: value})
            });
        }

        async function loadSettings() {
            const res = await fetch('/api/settings/');
            const data = await res.json();
            const freq = data.settings.idle_chat_frequency || '15';
            document.getElementById('freq-slider').value = freq;
            document.getElementById('freq-value').textContent = freq + 'm';
        }

        // Initialize
        window.onload = async () => {
            await loadAgents();
            await loadTasks();
            await loadSettings();
            await loadGroupMessages();
            connectWS();

            // Refresh agents and tasks every 30 seconds
            setInterval(async () => {
                await loadAgents();
                await loadTasks();
            }, 30000);

            // Drag and drop on chat area
            const chatArea = document.querySelector('.chat-area');
            chatArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                chatArea.classList.add('drag-over');
            });
            chatArea.addEventListener('dragleave', () => {
                chatArea.classList.remove('drag-over');
            });
            chatArea.addEventListener('drop', (e) => {
                e.preventDefault();
                chatArea.classList.remove('drag-over');
                if (e.dataTransfer.files.length > 0) {
                    uploadAndSend(e.dataTransfer.files[0]);
                }
            });

            // Paste from clipboard
            document.addEventListener('paste', (e) => {
                const items = e.clipboardData.items;
                for (let item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        uploadAndSend(file);
                        break;
                    }
                }
            });
        };

        // File handling
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadAndSend(file);
                event.target.value = '';  // Reset input
            }
        }

        async function uploadAndSend(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/files/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || 'Upload failed');
                    return;
                }

                const data = await res.json();
                
                // Send as a message with file attachment
                const fileMsg = data.file_type === 'image' 
                    ? `[image:${data.url}:${data.original_name}]`
                    : `[file:${data.url}:${data.original_name}]`;

                if (currentTab === 'dm' && selectedAgent) {
                    ws.send(JSON.stringify({
                        type: 'dm',
                        agent_id: selectedAgent,
                        message: fileMsg
                    }));

                    appendMessage({
                        from_agent: 'user',
                        content: fileMsg,
                        timestamp: new Date().toISOString()
                    });
                } else if (currentTab === 'group') {
                    // Store in group chat via API
                    await fetch('/api/messages/group', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({from_agent: 'user', content: fileMsg})
                    });

                    appendMessage({
                        from_agent: 'user',
                        content: fileMsg,
                        timestamp: new Date().toISOString()
                    });
                }
            } catch (err) {
                alert('Upload failed: ' + err.message);
            }
        }

        function renderContent(content) {
            // Parse [image:url:name] and [file:url:name] tags
            let rendered = content;

            // Images
            rendered = rendered.replace(/\[image:(\/api\/files\/[^\]:]+):([^\]]+)\]/g, 
                '<img src="$1" alt="$2" title="$2" onclick="window.open(\'$1\', \'_blank\')">');

            // Files
            rendered = rendered.replace(/\[file:(\/api\/files\/[^\]:]+):([^\]]+)\]/g, 
                '<a class="file-attachment" href="$1" download="$2">📄 $2</a>');

            return rendered;
        }
    </script>
</body>
</html>
